model:
  name: "mistralai/mistral-7b-instruct-v0.2"
  temperature: 0.2
  max_tokens: 3000
  streaming: true

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  model_kwargs:
    device: "cpu"
  encode_kwargs:
    normalize_embeddings: true
    batch_size: 32  # Procesar embeddings en lotes más grandes

vectorstore:
  chunk_size: 800  # Reducido para procesamiento más rápido
  chunk_overlap: 100  # Reducido overlap
  top_k: 5
  collection_name: "technical_docs_v2"
  store_type: "chroma"  # ChromaDB es generalmente más rápido
  batch_size: 100  # Tamaño de lote para inserción

processing:
  max_workers: 4  # Número de hilos para procesamiento paralelo
  use_fast_loaders: true  # Usar loaders optimizados
  
memory:
  type: "conversation_buffer_window"
  k: 10
  return_messages: true

search:
  similarity_threshold: 0.7
  max_results: 5

ui:
  title: "Asistente Técnico Inteligente"
  theme: "light"
  sidebar_expanded: true
  page_icon: "🤖"
